      -H "Content-Type: application/json"
      --data '{"instance":"launch-canada","processor":"realtime","request":[{"id":{"name":"/EGSE/Pad/Camera/medium-double-double/connection_state"},"value":{"type":"BOOLEAN","booleanValue":true}},{"id":{"name":"/EGSE/Pad/Camera/medium-double-double/source_type"},"value":{"type":"STRING","stringValue":"'$MTX_SOURCE_TYPE'"}},{"id":{"name":"/EGSE/Pad/Camera/medium-double-double/source_id"},"value":{"type":"STRING","stringValue":"'$MTX_SOURCE_ID'"}},{"id":{"name":"/EGSE/Pad/Camera/medium-double-double/last_hook_event"},"value":{"type":"STRING","stringValue":"online"}}]}'
    runOnOffline: >-
