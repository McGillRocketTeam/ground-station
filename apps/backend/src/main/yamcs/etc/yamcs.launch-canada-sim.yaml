services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.parameter.SystemParametersService
    args:
      producers: ["jvm", "fs", "diskstats", "rocksdb"]
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: launch-canada-sim-realtime
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: true
      backFiller:
        enabled: false
        warmupTime: 60
  - class: org.yamcs.timeline.TimelineService

mdb:
  - type: xtce
    args:
      file: mdb/commands.xml

  - type: emptyNode
    spec: "EGSE"
    subLoaders:
      - type: emptyNode
        spec: "Pad"
        subLoaders:
          - type: xtce
            args:
              file: mdb/thermocouple.xml
          - type: xtce
            args:
              file: mdb/labjack-t7-local.xml

      - type: emptyNode
        spec: "ControlStation"
        subLoaders:
          - type: xtce
            spec: "ControlBox"
            args:
              file: mdb/controlbox.xml

  - type: emptyNode
    spec: "SystemA"
    subLoaders:
      - type: emptyNode
        spec: "Rocket"
        subLoaders:
          - type: xtce
            args:
              file: mdb/rocket.xml

      - type: emptyNode
        spec: "ControlStation"
        subLoaders:
          - type: xtce
            args:
              file: mdb/radio.xml
      - type: emptyNode
        spec: "Pad"
        subLoaders:
          - type: xtce
            args:
              file: mdb/radio.xml

  - type: emptyNode
    spec: "SystemB"
    subLoaders:
      - type: emptyNode
        spec: "Rocket"
        subLoaders:
          - type: xtce
            args:
              file: mdb/rocket.xml
      - type: emptyNode
        spec: "ControlStation"
        subLoaders:
          - type: xtce
            args:
              file: mdb/radio.xml
      - type: emptyNode
        spec: "Pad"
        subLoaders:
          - type: xtce
            args:
              file: mdb/radio.xml

streamConfig:
  tm:
    - name: "tm_stream"
      rootContainer: "/SystemA/Rocket/FlightComputer/FCFrame"
      processor: "realtime"
  tc:
    - name: "tc_realtime"
      processor: realtime
  cmdHist: ["cmdhist_realtime", "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["pp_realtime", "sys_param", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
