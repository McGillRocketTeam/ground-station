      --data '{"instance":"launch-canada","processor":"realtime","request":[{"id":{"name":"/EGSE/Pad/Camera/medium-double-double/availability_state"},"value":{"type":"BOOLEAN","booleanValue":false}},{"id":{"name":"/EGSE/Pad/Camera/medium-double-double/last_hook_event"},"value":{"type":"STRING","stringValue":"unavailable"}}]}'
    runOnOnline: >-
