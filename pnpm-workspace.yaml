packages:
  - packages/*
  - apps/*

# Supply-chain hardening: never install a registry version published less than
# this many minutes ago (3 days). Gives malicious/compromised releases time to be
# detected and unpublished before they can enter the lockfile. Requires pnpm >=10.16.
minimumReleaseAge: 4320

catalog:
  '@effect/language-service': ^0.86.2
  '@effect/opentelemetry': 4.0.0-beta.78
  '@effect/platform-browser': 4.0.0-beta.51
  '@effect/platform-node': 4.0.0-beta.78
  effect: 4.0.0-beta.51
  # Pinned to the pre-upgrade versions so `lint`/`fmt:check` behave as before.
  # oxfmt 0.53 and oxlint 1.68 reformat differently / add stricter rules that
  # flag pre-existing code; revisit as a separate formatting/lint-debt pass.
  oxfmt: 0.35.0
  oxlint: 1.50.0
  typescript: 6.0.3
