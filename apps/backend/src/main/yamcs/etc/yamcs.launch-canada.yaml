services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.parameter.SystemParametersService
    args:
      producers: ["jvm", "fs", "diskstats", "rocksdb"]
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: launch-canada-realtime
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: true
      backFiller:
        enabled: false
        warmupTime: 60
  - class: org.yamcs.timeline.TimelineService

dataLinks:
  - name: EGSE/Pad/LabJack
    class: org.yamcs.labjack2.LabJackDataLinkV2
    scanRateHz: 100
    tmPacketRateHz: 20
    tmStream: tm_labJack
    tcStream: tc_labJack
    packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: -1
      seqCountOffset: -1
  - name: EGSE/ControlStation/ControlBox
    class: org.yamcs.mrt.links.ControlBoxLink
    tmStream: tm_controlBox
    labJackCommands:

      - switchName: panel_3_switch_1
        pin: 0 # FIO 0 FILL

      - switchName: panel_4_switch_2
        pin: 6 # LA RET POWER

      - switchName: panel_2_switch_2
        pin: 4 # LA RET POLARITY

      - switchName: panel_4_switch_1
        pin: 1 # FIO 1 DUMP

      - switchName: panel_3_switch_2
        pin: 6 # LA RET POWER

      - switchName: panel_6_switch_1
        pin: 7 # LA DIS POWER

      - switchName: panel_6_switch_2
        pin: 5 # LA DIS POLARITY

      - switchName: panel_5_switch_2
        pin: 20 # IGN +

      - switchName: panel_1_switch_1
        pin: 21 # IGN -


      # DAQ CONTROL
      # - switchName: panel_5_switch_1
      #   pin: 21 # VENT

      # - switchName: panel_5_switch_2
      #   pin: 3 #F/DOV

      # - switchName: panel_2_switch_2
      #   pin: 2

    # AV CONTROL
    flightComputerCommands:
      - switchName: panel_9_switch_key
        onCommand: mov_arming
        offCommand: mov_disarming

      - switchName: panel_3_switch_2
        onCommand: vent_valve_energize
        offCommand: vent_valve_de-energize

      - switchName: panel_5_switch_1
        onCommand: fdov_energize
        offCommand: fdov_de-energize

      - switchName: panel_1_switch_estop
        onCommand: emergency_stop
        offCommand: emergency_cancel

      - switchName: panel_2_switch_1
        onCommand: launch
        offCommand: ""

    packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: -1
      seqCountOffset: -1


  - name: EGSE/ControlStation/EcoFlowMax
    class: org.yamcs.mrt.links.AstraGenericTmTcLink
    tmStream: egse_ecoflow_realtime
    tcStream: tc_ecoflow_realtime
    packetPreprocessorClassName: org.yamcs.mrt.utils.AstraPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: 2

  - name: SystemA/Rocket/FlightComputer
    class: org.yamcs.mrt.links.AstraGenericTmLink
    stream: system_a_fc_realtime
    packetPreprocessorClassName: org.yamcs.mrt.utils.AstraPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: 2
  - name: SystemA/ControlStation/Radio
    class: org.yamcs.mrt.links.AstraGenericTmTcLink
    tmStream: system_a_controlstation_radio_realtime
    tcStream: tc_radio_realtime
    telemetryStatusTargets:
      - SystemA/Rocket/FlightComputer
    packetPreprocessorClassName: org.yamcs.mrt.utils.AstraPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: 2
  - name: SystemA/Pad/Radio
    class: org.yamcs.mrt.links.AstraGenericTmTcLink
    tmStream: system_a_pad_radio_realtime
    tcStream: tc_radio_realtime
    telemetryStatusTargets:
      - SystemA/Rocket/FlightComputer
    packetPreprocessorClassName: org.yamcs.mrt.utils.AstraPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: 2

  - name: EGSE/ControlStation/WifiRouter
    class: org.yamcs.mrt.links.WifiRouterLink
    ppStream: pp_realtime
    endpoint: http://192.168.0.1:8080/ubus
    username: root
    password: ${env.WIFI_ROUTER_PASSWORD}
    pollIntervalSeconds: 2
    linkSpeedMbps: 100
    warningThresholdMbps: 80
    saturationThresholdMbps: 90

  - name: EGSE/ControlStation/OmadaSwitch
    class: org.yamcs.mrt.links.OmadaSwitchLink
    ppStream: pp_realtime
    tcStream: tc_omada
    endpoint: https://192.168.0.106:8043
    omadacId: 9384d75ad4be1a7130ac38ac06e1975a
    siteId: 6a7e1c7ce6bdee5886c6cc67
    switchMac: A8-29-48-FC-FB-AA
    portCount: 20
    clientId: ${env.OMADA_CLIENT_ID:}
    clientSecret: ${env.OMADA_CLIENT_SECRET:}
    pollIntervalSeconds: 2
    verifyTls: false

  - name: EGSE/Pad/OmadaSwitch
    class: org.yamcs.mrt.links.OmadaSwitchLink
    ppStream: pp_realtime
    tcStream: tc_omada
    endpoint: https://192.168.0.106:8043
    omadacId: 9384d75ad4be1a7130ac38ac06e1975a
    siteId: 6a7e1c7ce6bdee5886c6cc67
    switchMac: E0-D3-62-6E-A2-17
    portCount: 10
    clientId: ${env.OMADA_CLIENT_ID:}
    clientSecret: ${env.OMADA_CLIENT_SECRET:}
    pollIntervalSeconds: 2
    verifyTls: false

  - name: EGSE/ControlStation/BeamBridge
    class: org.yamcs.mrt.links.OmadaBeamBridgeLink
    ppStream: pp_realtime
    endpoint: https://192.168.0.106:8043
    omadacId: 9384d75ad4be1a7130ac38ac06e1975a
    siteId: 6a7e1c7ce6bdee5886c6cc67
    apMac: C0-3A-55-39-90-23
    peerMac: C0-3A-55-39-92-C4
    role: MAIN_AP
    clientId: ${env.OMADA_CLIENT_ID:}
    clientSecret: ${env.OMADA_CLIENT_SECRET:}
    pollIntervalSeconds: 2
    verifyTls: false

  - name: EGSE/Pad/BeamBridge
    class: org.yamcs.mrt.links.OmadaBeamBridgeLink
    ppStream: pp_realtime
    endpoint: https://192.168.0.106:8043
    omadacId: 9384d75ad4be1a7130ac38ac06e1975a
    siteId: 6a7e1c7ce6bdee5886c6cc67
    apMac: C0-3A-55-39-92-C4
    peerMac: C0-3A-55-39-90-23
    role: CLIENT_AP
    clientId: ${env.OMADA_CLIENT_ID:}
    clientSecret: ${env.OMADA_CLIENT_SECRET:}
    pollIntervalSeconds: 2
    verifyTls: false

  # - name: EGSE/Pad/ToughSwitch
  #   class: org.yamcs.mrt.links.ToughSwitchLink
  #   ppStream: pp_realtime
  #   ipAddress: 192.168.0.251
  #   username: ubnt
  #   password: ubnt

  - name: EGSE/ControlStation/Featherweight
    class: org.yamcs.mrt.links.FeatherweightLink
    enabledAtStartup: false
    ppStream: pp_realtime
    device: ${env.FEATHERWEIGHT_SERIAL_DEVICE:/dev/tty.usbmodem-featherweight}
    baudRate: 115200
    requireValidCrc: true

  - name: SystemB/Rocket/FlightComputer
    class: org.yamcs.mrt.links.AstraGenericTmLink
    stream: system_b_fc_realtime
    packetPreprocessorClassName: org.yamcs.mrt.utils.AstraPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: 2
  - name: SystemB/ControlStation/Radio
    class: org.yamcs.mrt.links.AstraGenericTmTcLink
    tmStream: system_b_controlstation_radio_realtime
    tcStream: tc_radio_realtime
    telemetryStatusTargets:
      - SystemB/Rocket/FlightComputer
    packetPreprocessorClassName: org.yamcs.mrt.utils.AstraPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: 2


  - name: SystemB/Pad/Radio
    class: org.yamcs.mrt.links.AstraGenericTmTcLink
    tmStream: system_b_pad_radio_realtime
    tcStream: tc_radio_realtime
    telemetryStatusTargets:
      - SystemB/Rocket/FlightComputer
    packetPreprocessorClassName: org.yamcs.mrt.utils.AstraPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: 2

  - name: EGSE/Pad/Thermocouple
    class: org.yamcs.mrt.links.AstraGenericTmTcLink
    tmStream: egse_thermocouple_realtime
    packetPreprocessorClassName: org.yamcs.mrt.utils.AstraPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: 2

  - name: FlightComputerCommands
    class: org.yamcs.mqtt.MqttFanoutCommandLink
    autoReconnect: true
    brokers:
      - ${env.MQTT_BROKER_URL:tcp://localhost:1883}
    tcStream: tc_realtime
    targets:
      - name: SystemA
        baseTopic: SystemA/Rocket/FlightComputer
        radioAckTopics:
          - SystemA/ControlStation/Radio/acks
      - name: SystemB
        baseTopic: SystemB/Rocket/FlightComputer
        radioAckTopics:
          - SystemB/Pad/Radio/acks
          - SystemB/ControlStation/Radio/acks

mdb:
  - type: xtce
    args:
      file: mdb/commands.xml


  - type: emptyNode
    spec: "EGSE"
    subLoaders:
      - type: emptyNode
        spec: "Pad"
        subLoaders:
          - type: xtce
            args:
              file: mdb/camera-local.xml
          - type: xtce
            args:
              file: mdb/thermocouple.xml
          - type: xtce
            args:
              file: mdb/labjack-t7.xml
          - type: xtce
            spec: "ToughSwitch"
            args:
              file: mdb/toughswitch.xml
          - type: xtce
            spec: "OmadaSwitch"
            args:
              file: mdb/omada-switch.xml
          - type: xtce
            spec: "BeamBridge"
            args:
              file: mdb/omada-beam-bridge.xml

      - type: emptyNode
        spec: "ControlStation"
        subLoaders:
          - type: xtce
            spec: "WifiRouter"
            args:
              file: mdb/wifi-router.xml
          - type: xtce
            spec: "OmadaSwitch"
            args:
              file: mdb/omada-switch.xml
          - type: xtce
            spec: "BeamBridge"
            args:
              file: mdb/omada-beam-bridge.xml
          - type: xtce
            spec: "ControlBox"
            args:
              file: mdb/controlbox.xml
          - type: xtce
            spec: "EcoFlowMax"
            args:
              file: mdb/ecoflow.xml
          - type: xtce
            spec: "Featherweight"
            args:
              file: mdb/featherweight.xml
  - type: emptyNode
    spec: "SystemA"
    subLoaders:
      - type: emptyNode
        spec: "Rocket"
        subLoaders:
          - type: xtce
            args:
              file: mdb/rocket.xml

      - type: emptyNode
        spec: "ControlStation"
        subLoaders:
          - type: xtce
            args:
              file: mdb/radio.xml
      - type: emptyNode
        spec: "Pad"
        subLoaders:
          - type: xtce
            args:
              file: mdb/radio.xml

  - type: emptyNode
    spec: "SystemB"
    subLoaders:
      - type: emptyNode
        spec: "Rocket"
        subLoaders:
          - type: xtce
            args:
              file: mdb/rocket.xml
      - type: emptyNode
        spec: "ControlStation"
        subLoaders:
          - type: xtce
            args:
              file: mdb/radio.xml
      - type: emptyNode
        spec: "Pad"
        subLoaders:
          - type: xtce
            args:
              file: mdb/radio.xml

# Configuration for streams created at server startup
streamConfig:
  tm:
    - name: "egse_ecoflow_realtime"
      rootContainer: "/EGSE/ControlStation/EcoFlowMax/EcoFlowMaxPacket"
      processor: "realtime"

    - name: "system_a_fc_realtime"
      rootContainer: "/SystemA/Rocket/FlightComputer/FCFrame"
      processor: "realtime"
    - name: "system_b_fc_realtime"
      rootContainer: "/SystemB/Rocket/FlightComputer/FCFrame"
      processor: "realtime"

    - name: "system_a_controlstation_radio_realtime"
      rootContainer: "/SystemA/ControlStation/Radio/TelemetryPacket"
      processor: "realtime"
    - name: "system_a_pad_radio_realtime"
      rootContainer: "/SystemA/Pad/Radio/TelemetryPacket"
      processor: "realtime"
    - name: "system_b_controlstation_radio_realtime"
      rootContainer: "/SystemB/ControlStation/Radio/TelemetryPacket"
      processor: "realtime"
    - name: "system_b_pad_radio_realtime"
      rootContainer: "/SystemB/Pad/Radio/TelemetryPacket"
      processor: "realtime"
    # Labjack
    - name: "tm_labJack"
      processor: "realtime"
      rootContainer: "/EGSE/Pad/LabJack/LabJackPacket"
    - name: "tm_controlBox"
      processor: "realtime"
      rootContainer: "/EGSE/ControlStation/ControlBox/ControlBoxPacket"

    # Thermocouple
    - name: "egse_thermocouple_realtime"
      processor: "realtime"
      rootContainer: "/EGSE/Pad/Thermocouple/ThermocoupleAggregatePacket"

  cmdHist: ["cmdhist_realtime", "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["pp_realtime", "sys_param", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
  tc:
    - name: "tc_realtime"
      processor: "realtime"
      tcPatterns: ["/FlightComputer/.*"]
    - name: "tc_radio_realtime"
      processor: "realtime"
      tcPatterns: [".*/Radio/.*"]
    - name: "tc_labJack"
      processor: "realtime"
      tcPatterns: [".*/LabJack/.*"]
    - name: "tc_omada"
      processor: "realtime"
      tcPatterns: [".*/OmadaSwitch/.*"]
    - name: "tc_ecoflow_realtime"
      processor: "realtime"
      tcPatterns: ["/EGSE/ControlStation/EcoFlowMax/.*"]
